<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Music Video Generator</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080912;color:#fff;
 font-family:Arial,sans-serif
}
main{
 max-width:760px;margin:auto;padding:18px 15px 50px
}
h1{font-size:25px;margin:5px 0}
.muted{opacity:.65;margin:5px 0 18px}
.card{
 background:#11131d;border:1px solid #292d3a;
 border-radius:18px;padding:16px;margin:12px 0
}
label{
 display:block;font-size:13px;opacity:.8;
 margin:10px 0 6px
}
input,textarea,select,button{
 width:100%;border-radius:12px;
 border:1px solid #303448;
 background:#171927;color:#fff;
 padding:12px;font-size:15px
}
textarea{min-height:150px;resize:vertical}
.grid{
 display:grid;grid-template-columns:1fr 1fr;
 gap:10px
}
button{
 background:#fff;color:#111;
 font-weight:800;border:0;
 margin-top:12px
}
button.secondary{
 background:#292d3a;color:#fff
}
button:disabled{opacity:.4}
#status{
 font-size:13px;opacity:.7;
 margin-top:10px;min-height:20px
}
.scene{
 background:#0d0f18;
 border:1px solid #292d3a;
 border-radius:14px;
 padding:13px;
 margin:10px 0
}
.scene h3{margin:0 0 7px}
.badge{
 display:inline-block;
 background:#292d3a;
 padding:5px 8px;
 border-radius:8px;
 font-size:11px;
 opacity:.8
}
.prompt{
 margin-top:10px;
 padding:10px;
 background:#080912;
 border-radius:10px;
 font-size:13px;
 line-height:1.5
}
canvas{
 width:100%;
 display:block;
 background:#020205;
 border-radius:15px;
 margin-top:10px
}
.small{
 font-size:12px;
 opacity:.55;
 line-height:1.5
}
</style>
</head>

<body>
<main>

<h1>🎬 Song → AI Music Video</h1>
<div class="muted">
Universal version • semua artis • semua lagu • storyboard otomatis
</div>

<div class="card">

<label>🎵 Lagu</label>
<input id="audio" type="file" accept="audio/*">

<div class="grid">
<div>
<label>Judul Lagu</label>
<input id="title" value="">
</div>

<div>
<label>Artis</label>
<input id="artist" value="">
</div>
</div>

<label>📝 Lirik / Cerita Lagu</label>
<textarea id="lyrics"
placeholder="Tempel lirik lengkap atau tulis cerita lagu di sini..."></textarea>

<div class="grid">

<div>
<label>🎨 Tema</label>
<select id="theme">
<option>Dark Cinematic</option>
<option>Romantic</option>
<option>Gothic Metal</option>
<option>EDM / Bass</option>
<option>Horeg / Festival</option>
<option>Pop Emotional</option>
<option>R&B</option>
<option>Rock</option>
<option>Fantasy</option>
<option>Sad Cinematic</option>
</select>
</div>

<div>
<label>📱 Rasio</label>
<select id="ratio">
<option value="9:16">9:16</option>
<option value="16:9">16:9</option>
<option value="1:1">1:1</option>
</select>
</div>

</div>

<button id="story">✨ Buat Storyboard Otomatis</button>

<div id="status"></div>

</div>

<div id="scenes"></div>

<div class="card">
<h3>🎧 Audio Reactive Preview</h3>
<canvas id="cv" width="720" height="1280"></canvas>

<button id="preview" class="secondary" disabled>
▶ Preview Video
</button>

<button id="record" disabled>
🎥 Rekam Video
</button>

<div class="small">
Preview menggunakan audio asli dan visual audio-reactive.
Storyboard serta prompt scene dibuat otomatis dari lagu.
</div>
</div>

</main>

<script>

const $=id=>document.getElementById(id);

let audio=null;
let ctx=null;
let analyser=null;
let source=null;
let animation=null;
let recorder=null;
let chunks=[];
let scenes=[];

const cv=$("cv");
const c=cv.getContext("2d");

const themes={
"Dark Cinematic":
"dark cinematic atmosphere, dramatic lighting, deep shadows, emotional realistic film look",

"Romantic":
"romantic cinematic atmosphere, beautiful soft lighting, emotional couple, realistic film look",

"Gothic Metal":
"gothic cinematic atmosphere, dark architecture, dramatic moonlight, mysterious realistic film",

"EDM / Bass":
"futuristic EDM atmosphere, neon lights, powerful stage, cinematic realistic visuals",

"Horeg / Festival":
"massive Indonesian music festival, powerful sound system, energetic crowd, cinematic realism",

"Pop Emotional":
"emotional modern music video, beautiful cinematic lighting, realistic human emotion",

"R&B":
"modern R&B music video, elegant night city, cinematic lighting, realistic photography",

"Rock":
"powerful rock music video, dramatic stage lighting, realistic cinematic photography",

"Fantasy":
"epic fantasy world, cinematic atmosphere, dramatic light, highly realistic film",

"Sad Cinematic":
"sad emotional cinematic scene, lonely atmosphere, dramatic natural lighting, realistic film"
};

function resize(){

 let r=$("ratio").value;

 if(r==="16:9"){
   cv.width=1280;
   cv.height=720;
 }else if(r==="1:1"){
   cv.width=900;
   cv.height=900;
 }else{
   cv.width=720;
   cv.height=1280;
 }

 draw();

}

$("ratio").onchange=resize;

function splitText(text){

 return text
 .split(/\n+/)
 .map(x=>x.trim())
 .filter(Boolean);

}

function makeScenes(){

 let title=$("title").value.trim() || "Untitled Song";
 let artist=$("artist").value.trim() || "Unknown Artist";
 let lyrics=$("lyrics").value.trim();

 if(!lyrics){
   alert("Masukkan lirik atau cerita lagu terlebih dahulu.");
   return;
 }

 let lines=splitText(lyrics);

 let sections=[
  "INTRO",
  "VERSE 1",
  "PRE-CHORUS",
  "CHORUS",
  "VERSE 2",
  "BRIDGE",
  "FINAL CHORUS",
  "OUTRO"
 ];

 while(lines.length<8){
   lines.push(lines[lines.length-1] || "Emotional cinematic moment");
 }

 let theme=$("theme").value;
 let base=themes[theme];

 scenes=[];

 for(let i=0;i<8;i++){

   let text=lines[i];

   scenes.push({
     name:sections[i],
     text:text,
     prompt:
     `Photorealistic cinematic music video scene for "${title}" by ${artist}. `+
     `${base}. `+
     `Visual story inspired by: ${text}. `+
     `Natural human appearance, realistic skin texture, realistic clothing, `+
     `cinematic composition, volumetric lighting, shallow depth of field, `+
     `high detail, professional music video cinematography, 4K, no text, no watermark.`
   });

 }

 renderScenes();

 $("preview").disabled=false;
 $("record").disabled=false;

 $("status").textContent=
 "Storyboard selesai. "+scenes.length+" scene dibuat otomatis.";

}

function renderScenes(){

 let html="";

 scenes.forEach((s,i)=>{

   html+=`
   <div class="card scene">
   <h3>${i+1}. ${s.name}</h3>
   <span class="badge">${s.text}</span>

   <div class="prompt">
   <b>🎬 AI SCENE PROMPT</b><br><br>
   ${s.prompt}
   </div>

   <button class="secondary"
   onclick="copyPrompt(${i})">
   📋 Copy Prompt
   </button>

   </div>
   `;

 });

 $("scenes").innerHTML=html;

}

window.copyPrompt=function(i){

 navigator.clipboard.writeText(scenes[i].prompt);

 $("status").textContent=
 "Prompt scene "+(i+1)+" berhasil disalin.";

}

$("story").onclick=makeScenes;

$("audio").onchange=function(){

 let file=this.files[0];

 if(!file)return;

 audio=new Audio();
 audio.src=URL.createObjectURL(file);
 audio.crossOrigin="anonymous";

 audio.onloadedmetadata=()=>{
   $("status").textContent=
   "Lagu siap. Durasi: "+
   Math.floor(audio.duration/60)+":"+
   String(Math.floor(audio.duration%60)).padStart(2,"0");
 };

};

function startAudio(){

 if(!audio){
   alert("Pilih file lagu terlebih dahulu.");
   return false;
 }

 if(!ctx){

   ctx=new(window.AudioContext||
   window.webkitAudioContext)();

   analyser=ctx.createAnalyser();
   analyser.fftSize=256;

   source=ctx.createMediaElementSource(audio);
   source.connect(analyser);
   analyser.connect(ctx.destination);

 }

 ctx.resume();

 audio.play();

 draw();

 return true;

}

$("preview").onclick=function(){

 if(!startAudio())return;

};

function draw(){

 if(!analyser){

   drawIdle();
   return;

 }

 let data=new Uint8Array(analyser.frequencyBinCount);

 function frame(){

   animation=requestAnimationFrame(frame);

   analyser.getByteFrequencyData(data);

   let avg=0;

   for(let i=0;i<data.length;i++)
   avg+=data[i];

   avg/=data.length;

   drawVisual(avg,data);

 }

 frame();

}

function drawIdle(){

 let w=cv.width;
 let h=cv.height;

 let g=c.createRadialGradient(
   w/2,h*.35,10,
   w/2,h*.35,h*.7
 );

 g.addColorStop(0,"#6655ff");
 g.addColorStop(1,"#03040a");

 c.fillStyle=g;
 c.fillRect(0,0,w,h);

}

function drawVisual(level,data){

 let w=cv.width;
 let h=cv.height;

 let g=c.createRadialGradient(
   w/2,h*.35,10,
   w/2,h*.35,h*.8
 );

 let power=Math.min(level/180,1);

 g.addColorStop(0,
 "#"+Math.floor(80+power*100)
 .toString(16).padStart(2,"0")+"55ff");

 g.addColorStop(1,"#020205");

 c.fillStyle=g;
 c.fillRect(0,0,w,h);

 c.save();

 c.translate(w/2,h*.35);

 let radius=
 Math.min(w,h)*.12+
 power*Math.min(w,h)*.18;

 c.beginPath();
 c.arc(0,0,radius,0,Math.PI*2);

 c.fillStyle=
 "rgba(120,90,255,"+
 (.15+power*.45)+")";

 c.fill();

 c.strokeStyle="#8d7cff";
 c.lineWidth=3;

 c.beginPath();

 for(let i=0;i<data.length;i++){

   let angle=
   (i/data.length)*Math.PI*2;

   let r=
   radius+
   data[i]*.7;

   let x=Math.cos(angle)*r;
   let y=Math.sin(angle)*r;

   if(i===0)c.moveTo(x,y);
   else c.lineTo(x,y);

 }

 c.closePath();
 c.stroke();

 c.restore();

}

$("record").onclick=async function(){

 if(!audio){
   alert("Pilih lagu terlebih dahulu.");
   return;
 }

 if(!startAudio())return;

 let stream=cv.captureStream(30);

 let audioStream=ctx.createMediaStreamDestination();

 source.connect(audioStream);

 audioStream.stream.getAudioTracks()
 .forEach(t=>stream.addTrack(t));

 chunks=[];

 recorder=new MediaRecorder(stream,{
   mimeType:"video/webm"
 });

 recorder.ondataavailable=e=>{
   if(e.data.size)chunks.push(e.data);
 };

 recorder.onstop=()=>{

   let blob=new Blob(chunks,{
     type:"video/webm"
   });

   let url=URL.createObjectURL(blob);

   let a=document.createElement("a");

   a.href=url;
   a.download=
   ($("title").value||"AI-Music-Video")+
   ".webm";

   a.click();

   $("status").textContent=
   "Video selesai direkam.";

 };

 recorder.start();

 $("status").textContent=
 "🎥 Rekaman berjalan...";

 audio.onended=()=>{
   if(recorder &&
      recorder.state!=="inactive"){
      recorder.stop();
   }
 };

};

resize();

</script>

</body>
</html>
