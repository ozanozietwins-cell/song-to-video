<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<title>Song → Video AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#07070c;
  color:#fff;
  font-family:system-ui,Arial,sans-serif
}
main{
  max-width:760px;
  margin:auto;
  padding:18px 15px 50px
}
h1{
  font-size:27px;
  margin:4px 0
}
.muted{
  opacity:.65;
  margin:0 0 18px
}
.card{
  background:#11121a;
  border:1px solid #292a36;
  border-radius:18px;
  padding:16px;
  margin:12px 0
}
label{
  display:block;
  font-size:13px;
  opacity:.75;
  margin:11px 0 6px
}
input,textarea,select{
  width:100%;
  border-radius:12px;
  border:1px solid #303240;
  background:#171821;
  color:#fff;
  padding:12px;
  font-size:15px
}
textarea{
  min-height:130px;
  resize:vertical
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:13px;
  margin-top:12px;
  font-size:15px;
  font-weight:800;
  background:#fff;
  color:#111
}
button.secondary{
  background:#252632;
  color:#fff
}
button:disabled{
  opacity:.4
}
canvas{
  width:100%;
  display:block;
  background:#020205;
  border-radius:15px
}
.scene{
  padding:12px;
  border:1px solid #292a36;
  border-radius:12px;
  margin:7px 0;
  background:#0d0e15
}
.badge{
  font-size:11px;
  opacity:.55;
  display:inline-block;
  margin-top:5px
}
.status{
  min-height:22px;
  margin-top:9px;
  opacity:.8;
  font-size:13px
}
.download{
  display:block;
  text-align:center;
  background:#191b25;
  color:#fff;
  padding:13px;
  border-radius:12px;
  text-decoration:none;
  margin-top:10px
}
.small{
  font-size:12px;
  opacity:.55;
  line-height:1.5
}
</style>
</head>

<body>
<main>

<h1>🎬 Song → Video AI</h1>
<p class="muted">
Versi HP • Storyboard • Visual audio-reactive • Export WebM
</p>

<div class="card">

<label>🎵 Lagu</label>
<input id="audio" type="file" accept="audio/*">

<div class="grid">
<div>
<label>Judul</label>
<input id="title" value="LET ME GO">
</div>

<div>
<label>Artis</label>
<input id="artist" value="Soundfusion Project">
</div>
</div>

<label>📝 Lirik / cerita lagu</label>
<textarea id="lyrics">A woman is deeply hurt by the man she loves. He becomes cold and distant without explaining why. She keeps trying to save the relationship, but eventually discovers his betrayal. After loneliness and disappointment, she realizes that she deserves better. With tears in her eyes, she finally chooses to let him go and begins a new life.</textarea>

<div class="grid">

<div>
<label>🎨 Tema</label>
<select id="theme">
<option>Dark Cinematic</option>
<option>Romantic</option>
<option>Gothic Metal</option>
<option>EDM / Bass</option>
<option>Horeg / Festival</option>
<option>Dreamy</option>
<option>Sad Emotional</option>
</select>
</div>

<div>
<label>📐 Rasio</label>
<select id="ratio">
<option value="9:16">9:16</option>
<option value="16:9">16:9</option>
<option value="1:1">1:1</option>
</select>
</div>

</div>

<button id="story">✨ Buat Storyboard</button>

<div id="scenes"></div>

<button id="preview" class="secondary" disabled>▶ Preview Video</button>
<button id="record" class="secondary" disabled>🔴 Rekam Video</button>

<div id="status" class="status"></div>

</div>

<div class="card">
<canvas id="cv" width="720" height="1280"></canvas>
</div>

<div class="card small">
<b>Catatan:</b><br>
Aplikasi ini membuat video visual langsung di browser menggunakan lirik/cerita dan audio. 
Hasil rekaman dapat disimpan sebagai video WebM.
</div>

</main>

<script>
const $=id=>document.getElementById(id);

const audioInput=$("audio");
const titleInput=$("title");
const artistInput=$("artist");
const lyricsInput=$("lyrics");
const themeInput=$("theme");
const ratioInput=$("ratio");

const canvas=$("cv");
const ctx=canvas.getContext("2d");
const statusBox=$("status");

let audio=null;
let audioCtx=null;
let analyser=null;
let source=null;
let data=null;
let animation=null;
let recorder=null;
let chunks=[];
let scenes=[];

const palettes={
"Dark Cinematic":["#080612","#6c4cff"],
"Romantic":["#210812","#ff5d91"],
"Gothic Metal":["#08090e","#cf31ff"],
"EDM / Bass":["#020812","#00d8ff"],
"Horeg / Festival":["#120700","#ff8500"],
"Dreamy":["#07152a","#55b7ff"],
"Sad Emotional":["#07101c","#5d8dff"]
};

function resize(){
  const r=ratioInput.value;

  if(r==="16:9"){
    canvas.width=1280;
    canvas.height=720;
  }else if(r==="1:1"){
    canvas.width=1080;
    canvas.height=1080;
  }else{
    canvas.width=720;
    canvas.height=1280;
  }

  drawFrame(0);
}

ratioInput.onchange=resize;

function splitStory(text){
  let parts=text
    .split(/\n+/)
    .map(x=>x.trim())
    .filter(Boolean);

  if(parts.length<4){
    const sentences=text
      .split(/[.!?]+/)
      .map(x=>x.trim())
      .filter(Boolean);

    parts=sentences;
  }

  if(parts.length<4){
    parts=[
      "Intro — establish the atmosphere",
      "Verse — introduce the story",
      "Chorus — emotional peak",
      "Verse 2 — conflict develops",
      "Bridge — realization",
      "Final Chorus — emotional release",
      "Outro — new beginning"
    ];
  }

  return parts.slice(0,8);
}

function makeStoryboard(){

  scenes=splitStory(lyricsInput.value);

  const names=[
    "INTRO",
    "VERSE",
    "PRE-CHORUS",
    "CHORUS",
    "VERSE 2",
    "BRIDGE",
    "FINAL CHORUS",
    "OUTRO"
  ];

  $("scenes").innerHTML=scenes.map((text,i)=>`
    <div class="scene">
      <b>${names[i]||"SCENE "+(i+1)}</b><br>
      <span class="badge">${text}</span>
    </div>
  `).join("");

  $("preview").disabled=false;
  $("record").disabled=false;

  statusBox.textContent=
    "Storyboard dibuat. Tekan Preview untuk melihat animasi.";

  drawFrame(0);
}

function drawFrame(t){

  const [bg,accent]=palettes[themeInput.value]||palettes["Dark Cinematic"];

  const w=canvas.width;
  const h=canvas.height;

  const g=ctx.createRadialGradient(
    w*.5,h*.4,20,
    w*.5,h*.5,Math.max(w,h)*.75
  );

  g.addColorStop(0,accent);
  g.addColorStop(.25,bg);
  g.addColorStop(1,"#000");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,w,h);

  const level=analyser&&data
    ? data.reduce((a,b)=>a+b,0)/data.length/255
    : .15+Math.sin(t/500)*.05;

  const pulse=1+level*.7;

  ctx.save();
  ctx.translate(w/2,h*.42);
  ctx.beginPath();
  ctx.arc(0,0,Math.min(w,h)*.12*pulse,0,Math.PI*2);
  ctx.fillStyle=accent+"55";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0,0,Math.min(w,h)*.075*pulse,0,Math.PI*2);
  ctx.fillStyle=accent+"99";
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle=accent;
  ctx.lineWidth=Math.max(2,w/360);

  ctx.beginPath();

  const base=h*.65;

  for(let x=0;x<w;x+=5){

    let amp=level*h*.15;
    let y=base+
      Math.sin(x*.025+t*.004)*amp+
      Math.sin(x*.08+t*.007)*amp*.4;

    if(analyser&&data){
      const index=Math.floor(x/w*data.length);
      y-=data[index]/255*amp;
    }

    if(x===0)ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }

  ctx.stroke();

  ctx.textAlign="center";

  ctx.fillStyle="#fff";
  ctx.font=`bold ${Math.max(20,w/22)}px system-ui`;
  ctx.fillText(titleInput.value,w/2,h*.10);

  ctx.font=`${Math.max(13,w/42)}px system-ui`;
  ctx.globalAlpha=.7;
  ctx.fillText(artistInput.value,w/2,h*.14);
  ctx.globalAlpha=1;

  const sceneIndex=scenes.length
    ? Math.min(
        scenes.length-1,
        Math.floor((t/1000)%Math.max(1,scenes.length))
      )
    : 0;

  if(scenes[sceneIndex]){
    ctx.font=`${Math.max(14,w/38)}px system-ui`;
    ctx.globalAlpha=.75;
    ctx.fillText(
      scenes[sceneIndex],
      w/2,
      h*.82
    );
    ctx.globalAlpha=1;
  }
}

async function setupAudio(){

  if(!audioInput.files[0]) return;

  if(!audioCtx){
    audioCtx=new AudioContext();

    analyser=audioCtx.createAnalyser();
    analyser.fftSize=256;

    source=audioCtx.createMediaElementSource(audio);

    source.connect(analyser);
    analyser.connect(audioCtx.destination);

    data=new Uint8Array(analyser.frequencyBinCount);
  }

  if(audioCtx.state==="suspended"){
    await audioCtx.resume();
  }
}

function preview(){

  if(!audioInput.files[0]){
    statusBox.textContent="Pilih file lagu terlebih dahulu.";
    return;
  }

  if(!audio){
    audio=new Audio();
    audio.src=URL.createObjectURL(audioInput.files[0]);
    audio.crossOrigin="anonymous";
  }

  setupAudio().then(()=>{
    audio.currentTime=0;
    audio.play();

    const start=performance.now();

    function loop(now){
      const t=now-start;

      if(analyser){
        analyser.getByteFrequencyData(data);
      }

      drawFrame(t);

      if(!audio.paused){
        animation=requestAnimationFrame(loop);
      }
    }

    animation=requestAnimationFrame(loop);

    statusBox.textContent="Preview sedang berjalan...";
  });
}

async function recordVideo(){

  if(!audioInput.files[0]){
    statusBox.textContent="Pilih lagu terlebih dahulu.";
    return;
  }

  if(!audio){
    audio=new Audio();
    audio.src=URL.createObjectURL(audioInput.files[0]);
    audio.crossOrigin="anonymous";
  }

  await setupAudio();

  const stream=canvas.captureStream(30);

  const audioDestination=
    audioCtx.createMediaStreamDestination();

  analyser.connect(audioDestination);

  const combined=new MediaStream([
    ...stream.getVideoTracks(),
    ...audioDestination.stream.getAudioTracks()
  ]);

  chunks=[];

  const mime=
    MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
    ? "video/webm;codecs=vp9,opus"
    : "video/webm";

  recorder=new MediaRecorder(combined,{mimeType:mime});

  recorder.ondataavailable=e=>{
    if(e.data.size)chunks.push(e.data);
  };

  recorder.onstop=()=>{

    const blob=new Blob(chunks,{type:"video/webm"});

    const url=URL.createObjectURL(blob);

    const old=$("download");
    if(old)old.remove();

    const link=document.createElement("a");

    link.id="download";
    link.className="download";
    link.href=url;
    link.download=
      (titleInput.value||"song-video")
      .replace(/[^\w\-]+/g,"_")+
      ".webm";

    link.textContent="⬇️ Simpan Video";

    $("status").after(link);

    statusBox.textContent=
      "Video selesai dibuat. Tekan Simpan Video.";
  };

  recorder.start(1000);

  audio.currentTime=0;
  audio.play();

  const start=performance.now();

  function loop(now){

    const t=now-start;

    if(analyser){
      analyser.getByteFrequencyData(data);
    }

    drawFrame(t);

    if(!audio.paused && recorder.state==="recording"){
      animation=requestAnimationFrame(loop);
    }
  }

  animation=requestAnimationFrame(loop);

  statusBox.textContent=
    "🔴 Sedang merekam video...";

  audio.onended=()=>{
    if(recorder.state==="recording"){
      recorder.stop();
    }
  };
}

$("story").onclick=makeStoryboard;
$("preview").onclick=preview;
$("record").onclick=recordVideo;

resize();
makeStoryboard();
</script>

</body>
</html>
